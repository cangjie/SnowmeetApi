<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script type="text/javascript" src="../js/jquery-3.6.1.min.js"></script>
    <script type="text/javascript" src="../js/util.js"></script>
</head>

<body>
    <div id="ali" style="display: none;">
        <div style="display: flex; justify-content: center;">
            <input type="number" style="width: 300px;height:50px;font-size: 15pt;text-align: center;"
                placeholder="请输入支付金额" inputmode="decimal" />
        </div>
        <div style="display: flex; justify-content: center;margin-top: 50px;">
            <input type="button" value=" 确 认 支 付 " style="width: 150px;height:50px;font-size: 15pt;" />
        </div>
    </div>
    <div id="wepay" style="display: none;">
    </div>
</body>
<script type="text/javascript">
    var ua = navigator.userAgent
    if (ua.toLowerCase().indexOf("ali") >= 0) {
        var aliDiv = document.getElementById('ali')
        aliDiv.style.display = 'block'
    }
    else {   
        var path = 'pages/payment/uni_pay'
        var query = ''
        var version = 'develop'
        var wepayDiv = document.getElementById('wepay')
        wepayDiv.style.display = 'block'
        var url = '/api/MiniAppHelper/OpenMiniProgram?path=' + encodeURIComponent(path) + (query ? ('&query=' + encodeURIComponent(query)) : '') + '&version=' + encodeURIComponent(version);
        $.ajax({
            url: url,
            type: 'GET',
            success: function (msg, status) {
                if (status != 'success') {
                    return;
                }
                console.log('open mapp', msg);
                var msgObj = JSON.parse(msg);
                if (msgObj.openlink) {
                    window.location.href = msgObj.openlink;
                }

            }
        })
    }
</script>

</html>
