    <meta charset="utf-8" />

    <title>敬请支付</title>
</head>

<body>
    <div id="ali" >
        <div style="display: flex; justify-content: center;">
            <input id="txtAmount" type="number" style="width: 300px;height:50px;font-size: 15pt;text-align: center;"
                placeholder="请输入支付金额" inputmode="decimal" input="setAmount" />
        </div>
        <div style="display: flex; justify-content: center;margin-top: 50px;">
            <input id="btnPay" type="button" value=" 确 认 支 付 " style="width: 150px;height:50px;font-size: 15pt;" disabled click="pay()" />
        </div>
    </div>
    <div id="wepay" style="display: none;">
    </div>
</body>
<script type="text/javascript">
    var amount = 0
    var txtAmount = document.getElementById('txtAmount')
    txtAmount.addEventListener('input', setAmount)
    function setAmount(){
        
        var btnPay = document.getElementById('btnPay')
        var value = txtAmount.value
        if (value != null && value != '' && !isNaN(value)){
            amount = parseFloat(value)
            btnPay.disabled = false;
        }
        else {
            btnPay.disabled = true;
        }
    }
    function pay(){
        alert('pay')
    }
