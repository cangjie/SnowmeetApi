<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付宝内H5唤起支付</title>
    <!-- 引入支付宝JSAPI基础库（支付宝内打开自动加载，可省略） -->
    <script src="https://gw.alipayobjects.com/as/g/h5-lib/alipayjsapi/3.1.1/alipayjsapi.min.js"></script>
    
</head>
<body>
    <button onclick="callPay()">立即支付</button>

    <script>
        // 1. 获取用户authCode（支付宝内H5自动授权）
        function getAuthCode() {
            return new Promise((resolve, reject) => {
                // 支付宝内调用getAuthCode获取授权码
                alipay.getAuthCode({
                    appId: '2021004143665722',
                    success: res => resolve(res.authCode),
                    fail: err => reject(err)
                });
            });
        }
        async function callPay() {
            AlipayJSBridge.call("tradePay", {
  tradeNO: "Test_UniPay_20260220070101", // 商户生成的唯一订单号
  bizType: "00",   // 业务类型（如"00"表示即时到账）
  bizParams: "" // JSON格式的业务扩展参数
}, function(result) {
    alert(result.resultCode);
  if (result.resultCode === "9000") {
    
    console.log("支付成功");
  } else {
    console.log("支付失败", result);
  }
});
        }
