<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>录入批次</title>
<link rel="stylesheet" href="mat.css?v=260716">
</head>
<body>

<header class="header">
  <div>
    <h1 id="pageTitle">录入批次</h1>
    <div class="sub">登记效期 · 加入到期提醒</div>
  </div>
</header>

<div class="form">

  <!-- 基本信息 -->
  <div class="section">
    <div class="shead"><span class="st">基本信息</span></div>
    <div class="fgroup">
      <div class="flabel">名称<span class="req">*</span></div>
      <input class="finput" id="fName" type="text" placeholder="如：鲜牛奶（巴氏）" oninput="onNameInput()">
    </div>
    <div class="fgroup">
      <div class="flabel">批次号<span class="req">*</span><span class="hint">· 可自动生成</span></div>
      <div class="frow">
        <input class="finput" id="fBatchNo" type="text" placeholder="输入或点右侧生成" oninput="refresh()">
        <button class="gen-btn" onclick="genNo()">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 6V3L8 7l4 4V8a4 4 0 0 1 4 4a4 4 0 0 1-.6 2.1l1.46 1.46A6 6 0 0 0 12 6m0 10a4 4 0 0 1-4-4a4 4 0 0 1 .6-2.1L7.14 8.44A6 6 0 0 0 12 18v3l4-4l-4-4z"/></svg>生成
        </button>
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">现场照片<span class="hint">· 选填，可拍照或从相册上传</span></div>
      <div class="photo-grid" id="photoGrid">
        <button class="photo-add" onclick="document.getElementById('fFile').click()">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4a3.2 3.2 0 0 0 0 6.4M9 3L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3zm3 15a5 5 0 1 1 0-10a5 5 0 0 1 0 10"/></svg>
          拍照/上传
        </button>
      </div>
      <input id="fFile" type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="onFiles(this.files)">
    </div>
  </div>

  <!-- 效期 -->
  <div class="section">
    <div class="shead"><span class="st">效期</span><span class="sd">生产日期 + 保质期自动推算到期日</span></div>
    <div class="fgroup">
      <div class="flabel">生产日期</div>
      <input class="finput" id="fProduce" type="date" oninput="autoExpire()" onchange="autoExpire()">
    </div>
    <div class="fgroup">
      <div class="flabel">保质期</div>
      <div class="frow">
        <input class="finput" id="fShelf" type="number" inputmode="numeric" min="0" placeholder="数值" oninput="onShelfInput()">
        <div class="seg">
          <button id="unitDay" class="on" onclick="setUnit('天')">天</button>
          <button id="unitMonth" onclick="setUnit('月')">月</button>
        </div>
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">到期日期<span class="req">*</span><span class="hint">· 自动计算，可手动修改</span></div>
      <div class="frow">
        <input class="finput" id="fExpire" type="date" oninput="onExpireManual()" onchange="onExpireManual()">
        <span class="auto-tag" id="autoTag" style="display:none">自动</span>
      </div>
    </div>
  </div>

  <!-- 提醒 -->
  <div class="section">
    <div class="shead"><span class="st">提醒</span></div>
    <div class="fgroup">
      <div class="flabel">到期预警提前<span class="req">*</span><span class="hint">· 默认 3 天，可自定义</span></div>
      <div class="stepper">
        <button class="sbtn" onclick="stepWarn(-1)"><svg class="ic" viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
        <div class="sval">
          <input id="fWarn" type="number" inputmode="numeric" min="0" value="3" oninput="refresh()">
          <span>天</span>
        </div>
        <button class="sbtn" onclick="stepWarn(1)"><svg class="ic" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      </div>
      <div class="step-hint" id="warnHint">到期前 3 天进入临期提醒</div>
    </div>
  </div>

  <!-- 批次操作（编辑模式才显示；已处理批次只留删除） -->
  <div class="section" id="opsSection" style="display:none">
    <div class="shead"><span class="st">操作</span></div>
    <div class="ops-row">
      <button class="btn btn-plain" id="opDone" onclick="doDispose('用完')">标记用完</button>
      <button class="btn btn-plain" id="opScrap" onclick="doDispose('报废')">标记报废</button>
      <button class="btn btn-plain op-danger" onclick="doDelete()">删除</button>
    </div>
  </div>

  <!-- 状态预览 -->
  <div class="preview" id="preview" style="display:none">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20m.5 5v5.25l4.5 2.67l-.75 1.23L11 13V7z"/></svg>
    <div>
      <div class="pt" id="pvTitle"></div>
      <div class="pm" id="pvMeta"></div>
    </div>
  </div>

</div>

<div class="footer">
  <button class="btn btn-plain" onclick="history.length > 1 ? history.back() : location.href='index.html'">取消</button>
  <button class="btn btn-primary" id="saveBtn" disabled onclick="save()">
    <svg class="ic" viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7zm2 16H5V5h11.17L19 7.83zm-7-7a3 3 0 1 0 0 6a3 3 0 0 0 0-6M6 6h9v4H6z"/></svg>
    <span id="saveBtnText">保存并加入提醒</span>
  </button>
</div>

<script src="mat.js?v=260716b"></script>
<script>
var editId = 0;
var unit = '天';           // 保质期单位
var photos = [];           // [{id, path}]
var uploading = 0;
var todayStr = MAT.fmtDate(new Date());  // 预览仅展示用，落库判定以服务端为准
var allBatches = null;     // 新建模式：全量批次，供同名食材带出上次保质期
var shelfAutoFilled = false;  // 保质期当前值是自动带出的（可被新的同名匹配覆盖）；用户手输后清除
var nameTimer = null;

function $(id) { return document.getElementById(id); }

function setUnit(u) {
  unit = u;
  $('unitDay').classList.toggle('on', u === '天');
  $('unitMonth').classList.toggle('on', u === '月');
  autoExpire();
}

// 生产日期 + 保质期 → 到期日。生产日期/保质期/单位任一变化都重新推算，
// 手动改过的到期日只保留到下一次动这些源字段（动源 = 想重算）
function autoExpire() {
  var p = $('fProduce').value;
  var n = parseInt($('fShelf').value, 10);
  if (p && n > 0) {
    var d = new Date(p + 'T00:00:00');
    if (unit === '月') { d.setMonth(d.getMonth() + n); } else { d.setDate(d.getDate() + n); }
    $('fExpire').value = MAT.fmtDate(d);
    $('autoTag').style.display = '';
  }
  refresh();
}
function onExpireManual() {
  $('autoTag').style.display = 'none';
  refresh();
}

function onNameInput() {
  refresh();
  clearTimeout(nameTimer);
  nameTimer = setTimeout(applyShelfDefault, 600);
}

function onShelfInput() {
  shelfAutoFilled = false;  // 用户手输，之后同名匹配不再覆盖
  autoExpire();
}

// 新建时按名称找同名食材的最近批次（id 最大），带出其保质期作默认值。
// 只填「空白或此前自动带出」的保质期，不碰用户手输的值
function applyShelfDefault() {
  if (editId > 0 || !allBatches) { return; }
  var name = $('fName').value.trim();
  if (!name) { return; }
  if ($('fShelf').value && !shelfAutoFilled) { return; }
  var hit = null;
  for (var i = 0; i < allBatches.length; i++) {
    var b = allBatches[i];
    if ((b.name || '').trim() === name && b.shelf_life_value > 0 && (!hit || b.id > hit.id)) { hit = b; }
  }
  if (!hit) { return; }
  var u = hit.shelf_life_unit === '月' ? '月' : '天';
  $('fShelf').value = hit.shelf_life_value;
  shelfAutoFilled = true;
  MAT.showToast('已按上次记录默认保质期 ' + hit.shelf_life_value + ' ' + u);
  setUnit(u);  // setUnit 内部调 autoExpire → 到期日跟着推算
}

function stepWarn(delta) {
  var v = parseInt($('fWarn').value, 10);
  if (isNaN(v)) { v = 3; }
  v = Math.max(0, v + delta);
  $('fWarn').value = v;
  refresh();
}

function refresh() {
  var warn = parseInt($('fWarn').value, 10);
  if (isNaN(warn) || warn < 0) { warn = 0; }
  $('warnHint').textContent = '到期前 ' + warn + ' 天进入临期提醒';

  var expire = $('fExpire').value;
  if (expire) {
    var st = MAT.deriveStatus({ expire_date: expire, warn_days: warn, dispose_status: null }, todayStr);
    var days = MAT.daysBetween(todayStr, expire);
    var cls = { '已过期': 'expired', '今日': 'today', '临期': 'warning', '正常': 'normal' }[st] || '';
    var pv = $('preview');
    pv.style.display = '';
    pv.className = 'preview ' + cls;
    $('pvTitle').textContent = '录入后状态：' + st;
    $('pvMeta').textContent = (days < 0 ? '已逾期 ' + (-days) + ' 天' : days === 0 ? '今日到期' : '距到期还有 ' + days + ' 天')
      + ' · 到期 ' + expire.replace(/-/g, '/');
  } else {
    $('preview').style.display = 'none';
  }

  var ok = $('fName').value.trim() && $('fBatchNo').value.trim() && expire && uploading === 0;
  $('saveBtn').disabled = !ok;
}

async function genNo() {
  try {
    var data = await MAT.api('GenBatchNo');
    $('fBatchNo').value = data.batchNo;
    refresh();
  } catch (e) { MAT.showToast(e.message); }
}

// ---- 照片：即传即得 id ----
function renderPhotos() {
  var grid = $('photoGrid');
  grid.querySelectorAll('.phwrap').forEach(function (n) { n.remove(); });
  var addBtn = grid.querySelector('.photo-add');
  photos.forEach(function (p, i) {
    var w = document.createElement('div');
    w.className = 'phwrap';
    w.innerHTML = '<img class="ph" src="' + MAT.esc(p.path) + '"><button class="phdel" data-i="' + i + '">×</button>';
    w.querySelector('.phdel').onclick = function () { photos.splice(i, 1); renderPhotos(); };
    grid.insertBefore(w, addBtn);
  });
}

async function onFiles(files) {
  for (var i = 0; i < files.length; i++) {
    var fd = new FormData();
    fd.append('file', files[i]);
    uploading++;
    refresh();
    try {
      var data = await MAT.api('UploadPhoto', { formData: fd });
      photos.push({ id: data.id, path: data.file_path_name });
      renderPhotos();
    } catch (e) {
      MAT.showToast('照片上传失败：' + e.message);
    } finally {
      uploading--;
      refresh();
    }
  }
  $('fFile').value = '';
}

// ---- 保存 ----
async function save() {
  var body = {
    id: editId,
    name: $('fName').value.trim(),
    batch_no: $('fBatchNo').value.trim(),
    produce_date: $('fProduce').value || null,
    shelf_life_value: $('fShelf').value ? parseInt($('fShelf').value, 10) : null,
    shelf_life_unit: $('fShelf').value ? unit : null,
    expire_date: $('fExpire').value,
    warn_days: Math.max(0, parseInt($('fWarn').value, 10) || 0),
    image_ids: photos.length ? photos.map(function (p) { return p.id; }).join(',') : null
  };
  $('saveBtn').disabled = true;
  try {
    await MAT.api('SaveBatch', { body: body });
    MAT.showToast('已保存');
    setTimeout(function () { location.replace('index.html'); }, 400);
  } catch (e) {
    MAT.showToast(e.message);
    $('saveBtn').disabled = false;
  }
}

// ---- 批次操作（编辑模式，与列表页动作面板同一套接口/文案） ----
var curName = '';  // 删除确认文案用

async function doDispose(action) {
  if (!editId) { return; }
  try {
    await MAT.api('DisposeBatch', { params: { id: editId, action: action } });
    MAT.showToast('已标记' + action);
    setTimeout(function () { location.replace('index.html'); }, 400);
  } catch (e) { MAT.showToast(e.message); }
}

async function doDelete() {
  if (!editId) { return; }
  if (!confirm('删除「' + curName + '」？删除后列表不再显示。')) { return; }
  try {
    await MAT.api('DeleteBatch', { params: { id: editId } });
    MAT.showToast('已删除');
    setTimeout(function () { location.replace('index.html'); }, 400);
  } catch (e) { MAT.showToast(e.message); }
}

// ---- 编辑模式回填 ----
async function loadForEdit(id) {
  try {
    var data = await MAT.api('GetBatches');
    todayStr = data.today;
    var b = (data.batches || []).find(function (x) { return x.id === id; });
    if (!b) { MAT.showToast('批次不存在'); return; }
    $('pageTitle').textContent = '编辑批次';
    $('saveBtnText').textContent = '保存修改';
    curName = b.name || '';
    $('opsSection').style.display = '';
    if (b.dispose_status) {
      // 已处理批次不再显示标记按钮（后端本就幂等，纯 UI 收敛），删除仍可用
      $('opDone').style.display = 'none';
      $('opScrap').style.display = 'none';
    }
    $('fName').value = b.name || '';
    $('fBatchNo').value = b.batch_no || '';
    $('fProduce').value = (b.produce_date || '').slice(0, 10);
    $('fShelf').value = b.shelf_life_value == null ? '' : b.shelf_life_value;
    if (b.shelf_life_unit === '月') { setUnit('月'); }
    $('fExpire').value = (b.expire_date || '').slice(0, 10);
    $('fWarn').value = b.warn_days == null ? 3 : b.warn_days;
    // 存量批次 produce_date 可能为空（旧版页面无默认值）：有保质期时按 到期日−保质期 反推并真实落值，
    // 否则编辑时改保质期没有推算基准、联动不生效
    if (!$('fProduce').value && b.shelf_life_value > 0 && $('fExpire').value) {
      var pd = new Date($('fExpire').value + 'T00:00:00');
      if (b.shelf_life_unit === '月') { pd.setMonth(pd.getMonth() - b.shelf_life_value); }
      else { pd.setDate(pd.getDate() - b.shelf_life_value); }
      $('fProduce').value = MAT.fmtDate(pd);
    }
    // 回填的到期日是已存值，不标「自动」；用户再动生产日期/保质期时照常重新推算
    $('autoTag').style.display = 'none';
    if (b.image_ids) {
      var imgs = await MAT.api('GetImages', { params: { ids: b.image_ids } });
      photos = (imgs || []).map(function (im) { return { id: im.id, path: im.file_path_name }; });
      renderPhotos();
    }
    refresh();
  } catch (e) {
    if (e.message !== '会话失效') { MAT.showToast(e.message); }
  }
}

MAT.ensureSession().then(function (ok) {
  if (!ok) { return; }
  var id = parseInt(new URLSearchParams(location.search).get('id'), 10) || 0;
  if (id > 0) {
    editId = id;
    loadForEdit(id);
  } else {
    // 生产日期默认今天并真实落值：date 输入框空值时 Safari 会浅色显示今天的假象，
    // 用户以为已填 → 保质期联动不触发。默认真值消除假象；与包装不符时店员自行改
    $('fProduce').value = todayStr;
    refresh();
    // 拉全量批次供同名食材带出保质期；失败静默降级（不影响录入）
    MAT.api('GetBatches').then(function (data) {
      todayStr = data.today || todayStr;
      allBatches = data.batches || [];
      applyShelfDefault();  // 数据回来前用户可能已输完名称，补一次匹配
    }).catch(function () {});
  }
});
</script>
</body>
</html>
