<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>录入批次</title>
<link rel="stylesheet" href="mat.css?v=260716f">
</head>
<body>

<header class="header">
  <div>
    <h1 id="pageTitle">录入批次</h1>
    <div class="sub">登记效期 · 加入到期提醒</div>
  </div>
</header>

<div class="form">

  <!-- 基本信息 -->
  <div class="section">
    <div class="shead"><span class="st">基本信息</span></div>
    <div class="fgroup">
      <div class="flabel">名称<span class="req">*</span></div>
      <div class="frow">
        <input class="finput" id="fName" type="text" placeholder="如：鲜牛奶（巴氏）" oninput="onNameInput()">
        <button class="gen-btn" onclick="startScan()">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4a3.2 3.2 0 0 0 0 6.4M9 3L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3zm3 15a5 5 0 1 1 0-10a5 5 0 0 1 0 10"/></svg>扫描
        </button>
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">批次号<span class="req">*</span><span class="hint">· 可自动生成</span></div>
      <div class="frow">
        <input class="finput" id="fBatchNo" type="text" placeholder="输入或点右侧生成" oninput="refresh()">
        <button class="gen-btn" onclick="genNo()">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 6V3L8 7l4 4V8a4 4 0 0 1 4 4a4 4 0 0 1-.6 2.1l1.46 1.46A6 6 0 0 0 12 6m0 10a4 4 0 0 1-4-4a4 4 0 0 1 .6-2.1L7.14 8.44A6 6 0 0 0 12 18v3l4-4l-4-4z"/></svg>生成
        </button>
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">现场照片<span class="hint">· 选填，可拍照或从相册上传</span></div>
      <div class="photo-grid" id="photoGrid">
        <button class="photo-add" onclick="document.getElementById('fFile').click()">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4a3.2 3.2 0 0 0 0 6.4M9 3L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3zm3 15a5 5 0 1 1 0-10a5 5 0 0 1 0 10"/></svg>
          拍照/上传
        </button>
      </div>
      <input id="fFile" type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="onFiles(this.files)">
    </div>
  </div>

  <!-- 效期 -->
  <div class="section">
    <div class="shead"><span class="st">效期</span><span class="sd">生产日期 + 保质期自动推算到期日</span></div>
    <div class="fgroup">
      <div class="flabel">生产日期</div>
      <div class="frow">
        <input class="finput" id="fProduce" type="date" oninput="autoExpire()" onchange="autoExpire()">
        <button class="gen-btn" onclick="startScan('date')">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4a3.2 3.2 0 0 0 0 6.4M9 3L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3zm3 15a5 5 0 1 1 0-10a5 5 0 0 1 0 10"/></svg>扫描
        </button>
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">保质期</div>
      <div class="frow">
        <input class="finput" id="fShelf" type="number" inputmode="numeric" min="0" placeholder="数值" oninput="onShelfInput()">
        <div class="seg">
          <button id="unitDay" class="on" onclick="setUnit('天')">天</button>
          <button id="unitMonth" onclick="setUnit('月')">月</button>
        </div>
        <button class="gen-btn" onclick="startScan('shelf')">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4a3.2 3.2 0 0 0 0 6.4M9 3L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3zm3 15a5 5 0 1 1 0-10a5 5 0 0 1 0 10"/></svg>扫描
        </button>
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">到期日期<span class="req">*</span><span class="hint">· 自动计算，可手动修改</span></div>
      <div class="frow">
        <input class="finput" id="fExpire" type="date" oninput="onExpireManual()" onchange="onExpireManual()">
        <span class="auto-tag" id="autoTag" style="display:none">自动</span>
        <button class="gen-btn" onclick="startScan('expire')">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4a3.2 3.2 0 0 0 0 6.4M9 3L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3zm3 15a5 5 0 1 1 0-10a5 5 0 0 1 0 10"/></svg>扫描
        </button>
      </div>
    </div>
  </div>

  <!-- 提醒 -->
  <div class="section">
    <div class="shead"><span class="st">提醒</span></div>
    <div class="fgroup">
      <div class="flabel">到期预警提前<span class="req">*</span><span class="hint">· 默认 3 天，可自定义</span></div>
      <div class="stepper">
        <button class="sbtn" onclick="stepWarn(-1)"><svg class="ic" viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
        <div class="sval">
          <input id="fWarn" type="number" inputmode="numeric" min="0" value="3" oninput="onWarnInput()">
          <span>天</span>
        </div>
        <button class="sbtn" onclick="stepWarn(1)"><svg class="ic" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      </div>
      <div class="step-hint" id="warnHint">到期前 3 天进入临期提醒</div>
    </div>
  </div>

  <!-- 批次操作（编辑模式才显示；已处理批次只留 返回列表/删除） -->
  <div class="section" id="opsSection" style="display:none">
    <div class="shead"><span class="st">操作</span></div>
    <div class="ops-grid">
      <button class="op-btn op-done" id="opDone" onclick="doDispose('用完')">
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19L21 7l-1.4-1.4z"/></svg>标记用完
      </button>
      <button class="op-btn op-scrap" id="opScrap" onclick="doDispose('报废')">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20m-1 5h2v6h-2zm0 8h2v2h-2z"/></svg>标记报废
      </button>
      <button class="op-btn op-back" onclick="location.replace('index.html')">
        <svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8l8 8l1.41-1.41L7.83 13H20z"/></svg>返回列表
      </button>
      <button class="op-btn op-del" onclick="doDelete()">
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>删除
      </button>
    </div>
  </div>

  <!-- 状态预览 -->
  <div class="preview" id="preview" style="display:none">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20m.5 5v5.25l4.5 2.67l-.75 1.23L11 13V7z"/></svg>
    <div>
      <div class="pt" id="pvTitle"></div>
      <div class="pm" id="pvMeta"></div>
    </div>
  </div>

</div>

<!-- 名称实时扫描层（getUserMedia 取景 + 逐帧 OCR 候选点选，不存照片） -->
<div class="scan-layer" id="scanLayer" style="display:none">
  <video id="scanVideo" playsinline autoplay muted></video>
  <div class="scan-frame"></div>
  <div class="scan-tip" id="scanTip">对准食材包装上的名称</div>
  <div class="scan-bottom">
    <button class="scan-confirm" id="scanConfirm" style="display:none" onclick="confirmPick()"></button>
    <div class="scan-cands" id="scanCands"></div>
  </div>
  <button class="scan-close" onclick="stopScan()" aria-label="关闭">×</button>
</div>
<canvas id="scanCanvas" style="display:none"></canvas>

<div class="footer">
  <button class="btn btn-plain" onclick="history.length > 1 ? history.back() : location.href='index.html'">取消</button>
  <button class="btn btn-primary" id="saveBtn" disabled onclick="save()">
    <svg class="ic" viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7zm2 16H5V5h11.17L19 7.83zm-7-7a3 3 0 1 0 0 6a3 3 0 0 0 0-6M6 6h9v4H6z"/></svg>
    <span id="saveBtnText">保存并加入提醒</span>
  </button>
</div>

<script src="mat.js?v=260716b"></script>
<script>
var editId = 0;
var unit = '天';           // 保质期单位
var photos = [];           // [{id, path}]
var uploading = 0;
var todayStr = MAT.fmtDate(new Date());  // 预览仅展示用，落库判定以服务端为准
var allBatches = null;     // 新建模式：全量批次，供同名食材带出上次保质期/预警天数
var shelfAutoFilled = false;  // 保质期当前值是自动带出的（可被新的同名匹配覆盖）；用户手输后清除
var warnTouched = false;      // 预警天数被用户手动改过（输入或步进）后，同名匹配不再覆盖
var nameTimer = null;

function $(id) { return document.getElementById(id); }

function setUnit(u) {
  unit = u;
  $('unitDay').classList.toggle('on', u === '天');
  $('unitMonth').classList.toggle('on', u === '月');
  autoExpire();
}

// 生产日期 + 保质期 → 到期日。生产日期/保质期/单位任一变化都重新推算，
// 手动改过的到期日只保留到下一次动这些源字段（动源 = 想重算）
function autoExpire() {
  var p = $('fProduce').value;
  var n = parseInt($('fShelf').value, 10);
  if (p && n > 0) {
    var d = new Date(p + 'T00:00:00');
    if (unit === '月') { d.setMonth(d.getMonth() + n); } else { d.setDate(d.getDate() + n); }
    $('fExpire').value = MAT.fmtDate(d);
    $('autoTag').style.display = '';
  }
  refresh();
}
function onExpireManual() {
  $('autoTag').style.display = 'none';
  refresh();
}

function onNameInput() {
  refresh();
  clearTimeout(nameTimer);
  nameTimer = setTimeout(applyShelfDefault, 600);
}

function onShelfInput() {
  shelfAutoFilled = false;  // 用户手输，之后同名匹配不再覆盖
  autoExpire();
}

// 新建时按名称找同名食材的最近批次（id 最大），带出其 保质期 + 预警提前天数 作默认值。
// 各字段独立判定：只覆盖「空白/初始默认或此前自动带出」的值，不碰用户手动改过的
function applyShelfDefault() {
  if (editId > 0 || !allBatches) { return; }
  var name = $('fName').value.trim();
  if (!name) { return; }
  var hit = null;
  for (var i = 0; i < allBatches.length; i++) {
    var b = allBatches[i];
    if ((b.name || '').trim() === name && (!hit || b.id > hit.id)) { hit = b; }
  }
  if (!hit) { return; }
  var parts = [];
  var shelfUnit = null;
  if (hit.shelf_life_value > 0 && (!$('fShelf').value || shelfAutoFilled)) {
    shelfUnit = hit.shelf_life_unit === '月' ? '月' : '天';
    $('fShelf').value = hit.shelf_life_value;
    shelfAutoFilled = true;
    parts.push('保质期 ' + hit.shelf_life_value + ' ' + shelfUnit);
  }
  if (hit.warn_days != null && hit.warn_days >= 0 && !warnTouched
      && String(hit.warn_days) !== $('fWarn').value) {
    $('fWarn').value = hit.warn_days;
    parts.push('预警提前 ' + hit.warn_days + ' 天');
  }
  if (parts.length === 0) { return; }
  MAT.showToast('已按上次记录默认：' + parts.join(' · '));
  if (shelfUnit !== null) {
    setUnit(shelfUnit);  // setUnit 内部调 autoExpire → 到期日跟着推算 + refresh
  } else {
    refresh();           // 只带出预警天数时也要刷新提示文案/状态预览
  }
}

function onWarnInput() {
  warnTouched = true;
  refresh();
}

function stepWarn(delta) {
  var v = parseInt($('fWarn').value, 10);
  if (isNaN(v)) { v = 3; }
  v = Math.max(0, v + delta);
  $('fWarn').value = v;
  warnTouched = true;
  refresh();
}

function refresh() {
  var warn = parseInt($('fWarn').value, 10);
  if (isNaN(warn) || warn < 0) { warn = 0; }
  $('warnHint').textContent = '到期前 ' + warn + ' 天进入临期提醒';

  var expire = $('fExpire').value;
  if (expire) {
    var st = MAT.deriveStatus({ expire_date: expire, warn_days: warn, dispose_status: null }, todayStr);
    var days = MAT.daysBetween(todayStr, expire);
    var cls = { '已过期': 'expired', '今日': 'today', '临期': 'warning', '正常': 'normal' }[st] || '';
    var pv = $('preview');
    pv.style.display = '';
    pv.className = 'preview ' + cls;
    $('pvTitle').textContent = '录入后状态：' + st;
    $('pvMeta').textContent = (days < 0 ? '已逾期 ' + (-days) + ' 天' : days === 0 ? '今日到期' : '距到期还有 ' + days + ' 天')
      + ' · 到期 ' + expire.replace(/-/g, '/');
  } else {
    $('preview').style.display = 'none';
  }

  var ok = $('fName').value.trim() && $('fBatchNo').value.trim() && expire && uploading === 0;
  $('saveBtn').disabled = !ok;
}

async function genNo() {
  try {
    var data = await MAT.api('GenBatchNo');
    $('fBatchNo').value = data.batchNo;
    refresh();
  } catch (e) { MAT.showToast(e.message); }
}

// ---- 照片：即传即得 id ----
function renderPhotos() {
  var grid = $('photoGrid');
  grid.querySelectorAll('.phwrap').forEach(function (n) { n.remove(); });
  var addBtn = grid.querySelector('.photo-add');
  photos.forEach(function (p, i) {
    var w = document.createElement('div');
    w.className = 'phwrap';
    w.innerHTML = '<img class="ph" src="' + MAT.esc(p.path) + '"><button class="phdel" data-i="' + i + '">×</button>';
    w.querySelector('.phdel').onclick = function () { photos.splice(i, 1); renderPhotos(); };
    grid.insertBefore(w, addBtn);
  });
}

async function onFiles(files) {
  for (var i = 0; i < files.length; i++) {
    var fd = new FormData();
    fd.append('file', files[i]);
    uploading++;
    refresh();
    try {
      var data = await MAT.api('UploadPhoto', { formData: fd });
      photos.push({ id: data.id, path: data.file_path_name });
      renderPhotos();
    } catch (e) {
      MAT.showToast('照片上传失败：' + e.message);
    } finally {
      uploading--;
      refresh();
    }
  }
  $('fFile').value = '';
}

// ---- 保存 ----
async function save() {
  var body = {
    id: editId,
    name: $('fName').value.trim(),
    batch_no: $('fBatchNo').value.trim(),
    produce_date: $('fProduce').value || null,
    shelf_life_value: $('fShelf').value ? parseInt($('fShelf').value, 10) : null,
    shelf_life_unit: $('fShelf').value ? unit : null,
    expire_date: $('fExpire').value,
    warn_days: Math.max(0, parseInt($('fWarn').value, 10) || 0),
    image_ids: photos.length ? photos.map(function (p) { return p.id; }).join(',') : null
  };
  $('saveBtn').disabled = true;
  try {
    await MAT.api('SaveBatch', { body: body });
    MAT.showToast('已保存');
    setTimeout(function () { location.replace('index.html'); }, 400);
  } catch (e) {
    MAT.showToast(e.message);
    $('saveBtn').disabled = false;
  }
}

// ---- 名称实时扫描：getUserMedia 取景 → 每 1.3s 抓帧发 OCR → 候选多选按顺序拼接名称 ----
var scanStream = null, scanTimer = null, scanBusy = false, scanDeadline = 0;
var lastCands = [];   // 最近一帧名称候选文本（未选中的随帧刷新）
var lastDates = [];       // 最近一帧日期候选（yyyy-MM-dd，归一化自中英文各种格式）
var lastExpireDates = []; // 其中带到期锚词（保质期至/前食用/到期/EXP…）行的日期，expire 模式首选
var lastShelfLives = [];  // 保质期候选 [{value, unit}]（N天/N个月，阿拉伯+中文数字，后端归一化）
var scanPicked = [];  // 已选名称词，按点击顺序拼接；有选择期间暂停抓帧防列表跳动
var scanDate = null;  // 已选日期（单选；按模式填生产日期或到期日期）
var scanShelf = null; // 已选保质期 'value|unit'（shelf 模式单选）
var scanMode = 'all'; // 'all'=名称入口；'date'=生产日期；'expire'=到期日期（锚词优先）；'shelf'=保质期

async function startScan(mode) {
  scanMode = (mode === 'date' || mode === 'expire' || mode === 'shelf') ? mode : 'all';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    MAT.showToast('当前环境不支持相机，请手动输入');
    return;
  }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) {
    MAT.showToast('无法打开相机，请检查授权');
    return;
  }
  $('scanVideo').srcObject = scanStream;
  $('scanLayer').style.display = '';
  $('scanCands').innerHTML = '';
  $('scanConfirm').style.display = 'none';
  $('scanTip').textContent = scanMode === 'date' ? '对准包装上的生产日期'
    : (scanMode === 'expire' ? '对准包装上的到期日期 / 保质期标注'
    : (scanMode === 'shelf' ? '对准包装上的保质期标注' : '对准食材包装上的名称'));
  scanBusy = false;
  lastCands = [];
  lastDates = [];
  lastExpireDates = [];
  lastShelfLives = [];
  scanPicked = [];
  scanDate = null;
  scanShelf = null;
  scanDeadline = Date.now() + 30000;   // 30s 无果自动停帧（节流云调用），层保留可手动关
  scanTimer = setInterval(captureFrame, 1300);
}

function stopScan() {
  clearInterval(scanTimer);
  scanTimer = null;
  if (scanStream) {
    scanStream.getTracks().forEach(function (t) { t.stop(); });
    scanStream = null;
  }
  $('scanLayer').style.display = 'none';
  scanBusy = false;
}

async function captureFrame() {
  if (scanBusy || !scanStream) { return; }
  if (Date.now() > scanDeadline) {
    $('scanTip').textContent = '未识别到名称，可换角度重试或关闭后手动输入';
    clearInterval(scanTimer);
    scanTimer = null;
    return;
  }
  var v = $('scanVideo');
  if (!v.videoWidth) { return; }
  var c = $('scanCanvas');
  var w = Math.min(1000, v.videoWidth);
  c.width = w;
  c.height = Math.round(v.videoHeight * w / v.videoWidth);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  var b64 = c.toDataURL('image/jpeg', 0.7).split(',')[1];
  scanBusy = true;
  try {
    var data = await MAT.api('OcrScanName', { body: { image: b64 } });
    renderCands((data && data.candidates) || [], (data && data.dates) || [],
      (data && data.expireDates) || [], (data && data.shelfLives) || []);
  } catch (e) { /* 单帧失败静默，继续下一帧 */ }
  scanBusy = false;
}

function renderCands(cands, dates, expireDates, shelfLives) {
  if (!scanStream) { return; }
  if (cands.length > 0) {
    lastCands = cands.map(function (cd) { return cd.text; });
  }
  if (dates.length > 0) {
    lastDates = dates;
  }
  if (expireDates.length > 0) {
    lastExpireDates = expireDates;
  }
  if (shelfLives.length > 0) {
    lastShelfLives = shelfLives;
  }
  renderChips();
}

// 名称：已选固定在前（带序号高亮）；日期：📅 chip 单选；保质期：⏳ chip 单选；未选候选随帧刷新。
// date/expire/shelf 模式只显示各自候选；expire 模式带到期锚词的日期优先（有锚词命中就只列它们）
function renderChips() {
  var texts = scanMode !== 'all'
    ? []
    : scanPicked.concat(lastCands.filter(function (t) { return scanPicked.indexOf(t) < 0; }));
  var dateSrc = scanMode === 'shelf' ? []
    : (scanMode === 'expire'
        ? (lastExpireDates.length > 0 ? lastExpireDates : lastDates)
        : lastDates);
  var dates = (scanDate && dateSrc.indexOf(scanDate) < 0 ? [scanDate] : []).concat(dateSrc);
  var shelfs = scanMode === 'shelf' ? lastShelfLives : [];
  if (texts.length === 0 && dates.length === 0 && shelfs.length === 0) { return; }
  $('scanTip').textContent = (scanPicked.length > 0 || scanDate || scanShelf)
    ? '继续点选，完成后点下方按钮填入'
    : (scanMode === 'shelf' ? '点选 ⏳ 保质期'
    : (scanMode === 'expire'
        ? (lastExpireDates.length > 0 ? '已识别到期标注，点选 📅 日期' : '点选 📅 到期日期')
        : (scanMode === 'date' ? '点选 📅 生产日期' : '点选名称词（可多选拼接）和 📅 生产日期')));
  var html = texts.map(function (t) {
    var i = scanPicked.indexOf(t);
    return '<button class="scan-chip' + (i >= 0 ? ' on' : '') + '" data-t="' + MAT.esc(t) + '" onclick="toggleCand(this)">'
      + (i >= 0 ? '<span class="scan-chip-n">' + (i + 1) + '</span>' : '') + MAT.esc(t) + '</button>';
  }).join('');
  html += dates.map(function (d) {
    return '<button class="scan-chip date' + (scanDate === d ? ' on' : '') + '" data-t="' + MAT.esc(d) + '" onclick="toggleDate(this)">📅 ' + MAT.esc(d) + '</button>';
  }).join('');
  html += shelfs.map(function (sl) {
    var key = sl.value + '|' + sl.unit;
    return '<button class="scan-chip shelf' + (scanShelf === key ? ' on' : '') + '" data-t="' + key + '" onclick="toggleShelf(this)">⏳ '
      + sl.value + ' ' + (sl.unit === '月' ? '个月' : '天') + '</button>';
  }).join('');
  $('scanCands').innerHTML = html;
  var btn = $('scanConfirm');
  var parts = [];
  if (scanPicked.length > 0) { parts.push(scanPicked.join('')); }
  if (scanDate) { parts.push((scanMode === 'expire' ? '到期日期 ' : '生产日期 ') + scanDate); }
  if (scanShelf) {
    var sp = scanShelf.split('|');
    parts.push('保质期 ' + sp[0] + ' ' + (sp[1] === '月' ? '个月' : '天'));
  }
  if (parts.length > 0) {
    btn.style.display = '';
    btn.textContent = '填入：' + parts.join(' · ');
  } else {
    btn.style.display = 'none';
  }
}

// 有任何选择即暂停抓帧（候选固定不跳动、省 OCR 调用）；全部取消则恢复识别
function _syncScanPause() {
  if (scanPicked.length > 0 || scanDate || scanShelf) {
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  } else if (!scanTimer && scanStream) {
    scanDeadline = Date.now() + 30000;
    scanTimer = setInterval(captureFrame, 1300);
  }
}

// 保质期单选：再点取消，点别的换选
function toggleShelf(btn) {
  var k = btn.getAttribute('data-t');
  scanShelf = scanShelf === k ? null : k;
  _syncScanPause();
  renderChips();
}

function toggleCand(btn) {
  var t = btn.getAttribute('data-t');
  var i = scanPicked.indexOf(t);
  if (i >= 0) { scanPicked.splice(i, 1); } else { scanPicked.push(t); }
  _syncScanPause();
  renderChips();
}

// 生产日期单选：再点取消，点别的换选
function toggleDate(btn) {
  var d = btn.getAttribute('data-t');
  scanDate = scanDate === d ? null : d;
  _syncScanPause();
  renderChips();
}

function confirmPick() {
  if (scanPicked.length === 0 && !scanDate && !scanShelf) { return; }
  if (scanMode === 'shelf') {
    // 保质期：填值 + 切单位（setUnit 内部 autoExpire → 有生产日期时立即推算到期日）。
    // 扫描点选是用户主动行为，视同手输 —— 之后同名匹配不覆盖
    if (scanShelf) {
      var sp = scanShelf.split('|');
      $('fShelf').value = sp[0];
      shelfAutoFilled = false;
      stopScan();
      setUnit(sp[1] === '月' ? '月' : '天');
    } else {
      stopScan();
    }
    return;
  }
  if (scanMode === 'expire') {
    // 到期日期：等同手改语义 —— 直接落值、去「自动」标，不调 autoExpire（防被 生产日期+保质期 重算覆盖）
    if (scanDate) {
      $('fExpire').value = scanDate;
      $('autoTag').style.display = 'none';
    }
    stopScan();
    refresh();
    return;
  }
  if (scanPicked.length > 0) {
    $('fName').value = scanPicked.join('');
  }
  if (scanDate) {
    $('fProduce').value = scanDate;
  }
  stopScan();
  autoExpire();      // 生产日期落值后立即推算（保质期已有值时）
  if (scanPicked.length > 0) {
    onNameInput();   // 触发同名批次带出保质期/预警 + refresh
  }
}

// ---- 批次操作（编辑模式，与列表页动作面板同一套接口/文案） ----
var curName = '';  // 删除确认文案用

async function doDispose(action) {
  if (!editId) { return; }
  try {
    await MAT.api('DisposeBatch', { params: { id: editId, action: action } });
    MAT.showToast('已标记' + action);
    setTimeout(function () { location.replace('index.html'); }, 400);
  } catch (e) { MAT.showToast(e.message); }
}

async function doDelete() {
  if (!editId) { return; }
  if (!confirm('删除「' + curName + '」？删除后列表不再显示。')) { return; }
  try {
    await MAT.api('DeleteBatch', { params: { id: editId } });
    MAT.showToast('已删除');
    setTimeout(function () { location.replace('index.html'); }, 400);
  } catch (e) { MAT.showToast(e.message); }
}

// ---- 编辑模式回填 ----
async function loadForEdit(id) {
  try {
    var data = await MAT.api('GetBatches');
    todayStr = data.today;
    var b = (data.batches || []).find(function (x) { return x.id === id; });
    if (!b) { MAT.showToast('批次不存在'); return; }
    $('pageTitle').textContent = '编辑批次';
    $('saveBtnText').textContent = '保存修改';
    curName = b.name || '';
    $('opsSection').style.display = '';
    if (b.dispose_status) {
      // 已处理批次不再显示标记按钮（后端本就幂等，纯 UI 收敛），删除仍可用
      $('opDone').style.display = 'none';
      $('opScrap').style.display = 'none';
    }
    $('fName').value = b.name || '';
    $('fBatchNo').value = b.batch_no || '';
    $('fProduce').value = (b.produce_date || '').slice(0, 10);
    $('fShelf').value = b.shelf_life_value == null ? '' : b.shelf_life_value;
    if (b.shelf_life_unit === '月') { setUnit('月'); }
    $('fExpire').value = (b.expire_date || '').slice(0, 10);
    $('fWarn').value = b.warn_days == null ? 3 : b.warn_days;
    // 存量批次 produce_date 可能为空（旧版页面无默认值）：有保质期时按 到期日−保质期 反推并真实落值，
    // 否则编辑时改保质期没有推算基准、联动不生效
    if (!$('fProduce').value && b.shelf_life_value > 0 && $('fExpire').value) {
      var pd = new Date($('fExpire').value + 'T00:00:00');
      if (b.shelf_life_unit === '月') { pd.setMonth(pd.getMonth() - b.shelf_life_value); }
      else { pd.setDate(pd.getDate() - b.shelf_life_value); }
      $('fProduce').value = MAT.fmtDate(pd);
    }
    // 回填的到期日是已存值，不标「自动」；用户再动生产日期/保质期时照常重新推算
    $('autoTag').style.display = 'none';
    if (b.image_ids) {
      var imgs = await MAT.api('GetImages', { params: { ids: b.image_ids } });
      photos = (imgs || []).map(function (im) { return { id: im.id, path: im.file_path_name }; });
      renderPhotos();
    }
    refresh();
  } catch (e) {
    if (e.message !== '会话失效') { MAT.showToast(e.message); }
  }
}

MAT.ensureSession().then(function (ok) {
  if (!ok) { return; }
  var id = parseInt(new URLSearchParams(location.search).get('id'), 10) || 0;
  if (id > 0) {
    editId = id;
    loadForEdit(id);
  } else {
    // 生产日期默认今天并真实落值：date 输入框空值时 Safari 会浅色显示今天的假象，
    // 用户以为已填 → 保质期联动不触发。默认真值消除假象；与包装不符时店员自行改
    $('fProduce').value = todayStr;
    refresh();
    // 拉全量批次供同名食材带出保质期；失败静默降级（不影响录入）
    MAT.api('GetBatches').then(function (data) {
      todayStr = data.today || todayStr;
      allBatches = data.batches || [];
      applyShelfDefault();  // 数据回来前用户可能已输完名称，补一次匹配
    }).catch(function () {});
  }
});
</script>
