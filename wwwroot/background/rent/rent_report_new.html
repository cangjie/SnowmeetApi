        td {
            text-align: center;
            white-space: nowrap;
            padding-left: 5px;
            padding-right: 5px;
            border: solid;
            border-width: 1px;
            border-color: #fcfcfc;
        }

            background-color: yellow;
            color: black;
        }

<body>
    <div id="menu" style="display:flex; flex-direction:row; width:100%"></div>
    <div style="margin-top: 20px">
        <h1 style="text-align:center">租赁订单报表</h1>
    </div>
    <div class="row_view" style="align-items:center;justify-content:center; margin-top:20px">
        日期：从&nbsp;<input type="date" id="date_from" oninput="setDate()" />&nbsp;到&nbsp;<input type="date" id="date_to"
            oninput="setDate()" />
        &nbsp;<button id="btn" onclick="getData()"> 查 询 </button>&nbsp;<button onclick="download()"> 下 载 </button>
    </div>
    <div id="total" ></div>
    <div id="dailyTotals" style="white-space: pre-line;"></div>
    <div style="color:#555;font-size:14px">退款按系统记录统计：状态为成功或已有渠道退款单号；结余＝收款－退款。</div>
    <div style="text-align:center;display:flex;justify-content:left;margin-top:50px;overflow-x:auto;width:100%">
        <table style="border:solid;border-width:1px;width:100%;min-width:max-content">
            <thead>
                <tr id="tHead">
                </tr>
            </thead>
            <tbody id="tBody" class="table_body_row">
            </tbody>
        </table>
    </div>
</body>

</html>
<script type="text/javascript">
    function download() {
        if (tHead.length <= 0 || tData.length <= 0) {
            return;
        }
        var csvContent = '';
        var lineContent = '';
        for (var i = 0; i < tHead.length; i++) {
            lineContent += (i > 0 ? ',' : '') + csvCell(tHead[i]);
        }
        csvContent += lineContent + '\r\n';
        for (var i = 0; i < tData.length; i++) {
            lineContent = '';
            for (var j = 0; j < tHead.length; j++) {
                lineContent += (j > 0 ? ',' : '') + csvCell(tData[i][j]);
            }
            csvContent += lineContent + '\r\n';
        }
        csvContent = csvContent.trim();
        var link = document.createElement('a');
        link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent);
        link.download = encodeURIComponent('ZuLinDingDan_' + formatDate(startDate) + '_' + formatDate(endDate) + '.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    function csvCell(value) {
        var text = value == null ? '' : String(value);
        return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
    }
    var tHeadTemplate = ['序号', '订单号', '订单类型', '商品名称','订单日期','订单时间', '起租日期', '退租日期', '结算日期', '租金'];
    var tHead = tHeadTemplate.slice();
    var tData = [];
    var totalAmount = 0;
    var dailyAmounts = {};
    var dailyPaymentAmounts = Object.create(null);
    var resultPaymentMethods = [];
    var resultStartDate = '';
    var resultEndDate = '';
    render();

    function getData() {
        //tHeadTemplate = ['序号', '门店', '日序号', '星期','订单日期', '支付时间', '订单号', '状态', '免押金', '押金', '招待', '姓名', '电话', '备注', '开单人' ,'支付方式', '商户订单号', '租金合计'];
        //tHead = tHeadTemplate;
        totalAmount = 0;
        tData = [];
        dailyAmounts = {};
        dailyPaymentAmounts = Object.create(null);
        var queryStartDate = formatDate(startDate);
        var queryEndDate = formatDate(endDate);
        var btnCtrl = document.getElementById('btn');
        btnCtrl.disabled = true;
        btnCtrl.innerText = "查询中……";
        var getUrl = '../../api/Rent/GetConfirmedRentOrder?sessionKey=' + encodeURIComponent(sessionKey)
            + '&startDate=' + queryStartDate + '&endDate=' + queryEndDate + '&includeOtherPaymentMethods=true';
        $.ajax({
            url: getUrl,
            type: 'GET',
            success: function (msg, status) {
                console.log('get data msg', msg)
                console.log('get data status', status)
                btnCtrl.disabled = false;
                btnCtrl.innerText = " 查 询 ";

                if (status != 'success') {
                    return
                }
                resultStartDate = queryStartDate;
                resultEndDate = queryEndDate;
                tHead = tHeadTemplate.slice();
                var orders = msg.data
                console.log('get orders', orders);
                var index = 1;
                var paymentRows = [];
                var otherPaymentMethods = new Set();
                for (var i = 0; i < orders.length; i++) {
                    var order = orders[i];
                    var firstRowIndex = tData.length;
                    if (order.rentals != null && order.rentals.length > 0) {
                        for (var j = 0; j < order.rentals.length; j++) {
                            var rental = order.rentals[j]
                            if (rental.entertain != 0) {
                                continue;
                            }
                            var lineData = [];
                            for (var k = 0; k < tHead.length; k++) {
                                switch (tHead[k]) {
                                    case '序号':
                                        lineData[k] = index.toString();
                                        break;
                                    case '订单号':
                                        lineData[k] = order.code
                                        break;
                                    case '订单类型':
                                        lineData[k] = '正常订单'
                                        break;
                                    case '商品名称':
                                        lineData[k] = rental.name;
                                        break;
                                    case '订单日期':
                                        lineData[k] = formatDate(order.biz_date);
                                        break;
                                    case '订单时间':
                                        lineData[k] = formatTime(order.biz_date);
                                        break;
                                    case '起租日期':
                                        lineData[k] = formatDate(rental.realStartDate);
                                        break;
                                    case '退租日期':
                                        lineData[k] = formatDate(rental.realEndDate);
                                        break;
                                    case '结算日期':
                                        lineData[k] = formatDate(order.close_date);
                                        break;
                                    case '租金':
                                        var amount = rental.totalRentalAmount - rental.totalDiscountAmount;
                                        lineData[k] = amount.toFixed(2);
                                        break;
                                    default:
                                        break;
                                }

                            }
                            if (rental.totalRentalAmount - rental.totalDiscountAmount >= 1) {
                                tData.push(lineData);
                                totalAmount +=  (rental.totalRentalAmount - rental.totalDiscountAmount);
                                addDailyAmount(order.close_date, rental.totalRentalAmount - rental.totalDiscountAmount);
                                index++;
                            }
                        }
                    }
                    else {
                        var lineData = [];
                        for (var k = 0; k < tHead.length; k++) {
                            switch (tHead[k]) {
                                case '序号':
                                    lineData[k] = index.toString();
                                    break;
                                case '订单号':
                                    lineData[k] = order.code
                                    break;
                                case '订单类型':
                                    lineData[k] = '临时订单'
                                    break;
                                case '商品名称':
                                    lineData[k] = '--';
                                    break;
                                case '订单日期':
                                    lineData[k] = formatDate(order.biz_date);
                                    break;
                                case '订单时间':
                                    lineData[k] = formatTime(order.biz_date);
                                    break;
                                case '起租日期':
                                    lineData[k] = formatDate(order.biz_date);
                                    break;
                                case '退租日期':
                                    lineData[k] = formatDate(order.biz_date);
                                    break;
                                case '结算日期':
                                    if (order.availableRefunds.length > 0) {
                                        lineData[k] = formatDate(order.availableRefunds[order.availableRefunds.length - 1].create_date);
                                    }
                                    else {
                                        lineData[k] = '--';
                                    }
                                    break;
                                case '租金':
                                    var amount = order.paidAmount - order.refundAmount;
                                    lineData[k] = amount.toFixed(2);
                                    break;
                                default:
                                    break;
                            }

                        }
                        if (order.paidAmount - order.refundAmount >= 1) {
                            tData.push(lineData);
                            totalAmount += (order.paidAmount - order.refundAmount);
                            addDailyAmount(order.close_date, order.paidAmount - order.refundAmount);
                            index++;
                        }

                    }
                    if (tData.length > firstRowIndex) {
                        var payments = summarizePayments(order.availablePayments || []);
                        addDailyPayments(order.close_date, payments);
                        Object.keys(payments).forEach(function (method) {
                            if (method !== '微信支付' && method !== '支付宝') otherPaymentMethods.add(method);
                        });
                        paymentRows.push({ row: tData[firstRowIndex], payments: payments });
                    }
                }
                var paymentMethods = ['微信支付', '支付宝'].concat(Array.from(otherPaymentMethods).sort());
                resultPaymentMethods = paymentMethods;
                paymentMethods.forEach(function (method) {
                    tHead.push(method + '收款', method + '退款', method + '结余');
                });
                tData.forEach(function (row) {
                    while (row.length < tHead.length) row.push('');
                });
                paymentRows.forEach(function (entry) {
                    paymentMethods.forEach(function (method, index) {
                        var amounts = entry.payments[method];
                        if (!amounts) return;
                        var col = tHeadTemplate.length + index * 3;
                        entry.row[col] = (amounts.received / 100).toFixed(2);
                        entry.row[col + 1] = (amounts.refunded / 100).toFixed(2);
                        entry.row[col + 2] = ((amounts.received - amounts.refunded) / 100).toFixed(2);
                    });
                });
                console.log('get head', tHead);
                render();
            },
            finally: function (msg, status) {
                btnCtrl.disabled = false;
                btnCtrl.innerText = " 查 询 ";
            }
        })
    }
    function summarizePayments(payments) {
        var totals = Object.create(null);
        payments.forEach(function (payment) {
            var method = (payment.pay_method || '').trim() || '未标明支付方式';
            if (!totals[method]) totals[method] = { received: 0, refunded: 0 };
            totals[method].received += Math.round(Number(payment.amount) * 100);
            totals[method].refunded += Math.round(Number(payment.refundedAmount || 0) * 100);
        });
        return totals;
    }

    function addDailyAmount(closeDate, amount) {
        var date = formatDate(closeDate);
        dailyAmounts[date] = (dailyAmounts[date] || 0) + amount;
    }

    function addDailyPayments(closeDate, payments) {
        var date = formatDate(closeDate);
        if (!dailyPaymentAmounts[date]) dailyPaymentAmounts[date] = Object.create(null);
        Object.keys(payments).forEach(function (method) {
            var current = dailyPaymentAmounts[date][method] || 0;
            dailyPaymentAmounts[date][method] = current + payments[method].received - payments[method].refunded;
        });
    }

    function render() {
        var tHeadCtl = document.getElementById('tHead');
        tHeadCtl.innerHTML = '';
        for (var i = 0; i < tHead.length; i++) {
            var td = document.createElement('td');
            td.innerText = tHead[i];
            var classAttr = document.createAttribute('class');
            if (i == 4 || i == 5){
                classAttr.value = 'table_head private_column_title';
            }
            else{
                classAttr.value = 'table_head';
            }
            
            td.attributes.setNamedItem(classAttr);
            tHeadCtl.appendChild(td);
        }
        var tBodyCtl = document.getElementById('tBody');
        tBodyCtl.innerHTML = '';
        for (var i = 0; tData && i < tData.length; i++) {
            var tr = document.createElement('tr');

            for (var j = 0; j < tHead.length; j++) {
                var td = document.createElement('td');
                td.innerText = tData[i][j];
                tr.appendChild(td);
            }
            tBodyCtl.appendChild(tr);
        }
        var totalCell = document.getElementById('total');
        var totalText = "总计：" + totalAmount.toFixed(2);
        resultPaymentMethods.forEach(function (method) {
            var cents = 0;
            Object.keys(dailyPaymentAmounts).forEach(function (date) {
                cents += dailyPaymentAmounts[date][method] || 0;
            });
            totalText += '  |  ' + method + '结余：' + (cents / 100).toFixed(2);
        });
        totalCell.innerText = totalText;
        var dailyCell = document.getElementById('dailyTotals');
        dailyCell.innerText = '';
        if (resultStartDate && resultStartDate < resultEndDate) {
            var parts = resultStartDate.split('-');
            var day = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            var lines = ['每日汇总（结算日期）：'];
            while (formatDate(day) <= resultEndDate) {
                var date = formatDate(day);
                var line = date + '：租金 ' + (dailyAmounts[date] || 0).toFixed(2);
                resultPaymentMethods.forEach(function (method) {
                    var cents = dailyPaymentAmounts[date] && dailyPaymentAmounts[date][method] || 0;
                    line += '  |  ' + method + '结余：' + (cents / 100).toFixed(2);
                });
                lines.push(line);
                day.setDate(day.getDate() + 1);
            }
            dailyCell.innerText = lines.join('\n');
        }
    }
</script>
<script type="text/javascript" src="../../js/date_selector.js"></script>
