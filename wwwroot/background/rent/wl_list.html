<body>
    <!--div id="menu" style="display:flex; flex-direction:row; width:100%"></div-->
    <div style="margin-top: 20px">
        <h1 style="text-align:center">租赁订单报表</h1>
    </div>
    <div class="row_view" style="align-items:center;justify-content:center; margin-top:20px">
        日期：从&nbsp;<input type="date" id="date_from" oninput="setDate()" />&nbsp;到&nbsp;<input type="date" id="date_to"
            oninput="setDate()" />
        &nbsp;<button id="btn" onclick="getData()"> 查 询 </button>&nbsp;<button onclick="download()"> 下 载 </button>
    </div>
    <div id="total" ></div>
    <div style="text-align:center;display:flex;justify-content:left;margin-top:50px">
        <table style="border:solid;border-width:1px;width:100%">

                <tr id="tHead">
                </tr>
            </thead>

            </tbody>

<script type="text/javascript">
    function download() {
        if (tHead.length <= 0 || tData.length <= 0) {
            return;
        }
        var csvContent = '';
        var lineContent = '';
        for (var i = 0; i < tHead.length; i++) {
            lineContent += (i > 0 ? ',' : '') + tHead[i];
        }
        csvContent += lineContent + '\r\n';
        for (var i = 0; i < tData.length; i++) {
            lineContent = '';
            for (var j = 0; j < tHead.length; j++) {
                lineContent += (j > 0 ? ',' : '') + tData[i][j];
            }
            csvContent += lineContent + '\r\n';
        }
        csvContent = csvContent.trim();
        var link = document.createElement('a');
        link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent);
        link.download = encodeURIComponent('ZuLinDingDan_' + formatDate(startDate) + '_' + formatDate(endDate) + '.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    var tHeadTemplate = ['序号', '订单号', '订单类型', '商品名称', '起租日期', '退租日期', '结算日期', '租金'];
    var tHead = tHeadTemplate;
    var tData = [];
    render();
    var totalAmount = 0

    function getData() {
        //tHeadTemplate = ['序号', '门店', '日序号', '星期','订单日期', '支付时间', '订单号', '状态', '免押金', '押金', '招待', '姓名', '电话', '备注', '开单人' ,'支付方式', '商户订单号', '租金合计'];
        //tHead = tHeadTemplate;
        totalAmount = 0;
        tData = [];
        var btnCtrl = document.getElementById('btn');
        btnCtrl.disabled = true;
        btnCtrl.innerText = "查询中……";
        var getUrl = '../../api/Rent/GetConfirmedRentOrder?sessionKey=' + encodeURIComponent(sessionKey)
            + '&startDate=' + formatDate(startDate) + '&endDate=' + formatDate(endDate)+'&shop=' + encodeURIComponent('万龙体验中心');
        $.ajax({
            url: getUrl,
            type: 'GET',
            success: function (msg, status) {
                console.log('get data msg', msg)
                console.log('get data status', status)
                btnCtrl.disabled = false;
                btnCtrl.innerText = " 查 询 ";

                if (status != 'success') {
                    return
                }
                var orders = msg.data
                console.log('get orders', orders);
                var index = 1;
                for (var i = 0; i < orders.length; i++) {
                    var order = orders[i];
                    if (order.code == 'WT_ZL_251111_00003'){
                        console.log('aa')
                    }
                    if (order.rentals != null && order.rentals.length > 0) {
                        for (var j = 0; j < order.rentals.length; j++) {
                            var rental = order.rentals[j]
                            if (rental.entertain != 0) {
                                continue;
                            }
                            var lineData = [];
                            var display = false;
                            for (var k = 0; k < tHead.length; k++) {
                                switch (tHead[k]) {
                                    case '序号':
                                        lineData[k] = index.toString();
                                        break;
                                    case '订单号':
                                        lineData[k] = order.code
                                        break;
                                    case '订单类型':
                                        lineData[k] = '正常订单'
                                        break;
                                    case '商品名称':
                                        lineData[k] = rental.name;
                                        break;
                                    case '起租日期':
                                        lineData[k] = formatDate(rental.realStartDate);
                                        break;
                                    case '退租日期':
                                        lineData[k] = formatDate(rental.realEndDate);
                                        break;
                                    case '结算日期':
                                        lineData[k] = formatDate(order.close_date);
                                        break;
                                    case '租金':
                                        var amount = rental.totalRentalAmount - rental.totalDiscountAmount;
                                        lineData[k] = amount.toFixed(2);
                                        break;
                                    default:
                                        break;
                                }

                            }
                            if (rental.totalRentalAmount - rental.totalDiscountAmount >= 1) {
                                tData.push(lineData);
                                totalAmount +=  (rental.totalRentalAmount - rental.totalDiscountAmount);
                                index++;
                                display = true;
                            }
                        }
                        var lineSumData = []
                        for(var k = 0; display && k < tHead.length; k++){
                            switch(k){
                                case 0:
                                    lineSumData[k] = '总计'
                                default:
                                    lineSumData[k] = '--';
                                    break;
                            }
                        }
                        if (display){
                            tData.push(lineSumData);
                        }
                    }
                    else {
                        var lineData = [];
                        for (var k = 0; k < tHead.length; k++) {
                            switch (tHead[k]) {
                                case '序号':
                                    lineData[k] = index.toString();
                                    break;
                                case '订单号':
                                    lineData[k] = order.code
                                    break;
                                case '订单类型':
                                    lineData[k] = '临时订单'
                                    break;
                                case '商品名称':
                                    lineData[k] = '--';
                                    break;
                                case '起租日期':
                                    lineData[k] = formatDate(order.biz_date);
                                    break;
                                case '退租日期':
                                    lineData[k] = formatDate(order.biz_date);
                                    break;
                                case '结算日期':
                                    if (order.availableRefunds.length > 0) {
                                        lineData[k] = formatDate(order.availableRefunds[order.availableRefunds.length - 1].create_date);
                                    }
                                    else {
                                        lineData[k] = '--';
                                    }
                                    break;
                                case '租金':
                                    var amount = order.paidAmount - order.refundAmount;
                                    lineData[k] = amount.toFixed(2);
                                    break;
                                default:
                                    break;
                            }

                        }
                        if (order.paidAmount - order.refundAmount >= 1) {
                            tData.push(lineData);
                            totalAmount += (order.paidAmount - order.refundAmount);
                            index++;
                        }

                    }
                }
                console.log('get head', tHead);
                render();
            },
            finally: function (msg, status) {
                btnCtrl.disabled = false;
                btnCtrl.innerText = " 查 询 ";
            }
        })
    }
    function render() {
        var tHeadCtl = document.getElementById('tHead');
        tHeadCtl.innerHTML = '';
        for (var i = 0; i < tHead.length; i++) {
            var td = document.createElement('td');
            td.innerText = tHead[i];
            var classAttr = document.createAttribute('class');
            classAttr.value = 'table_head';
            td.attributes.setNamedItem(classAttr);
            tHeadCtl.appendChild(td);
        }
        var tBodyCtl = document.getElementById('tBody');
        tBodyCtl.innerHTML = '';
        for (var i = 0; tData && i < tData.length; i++) {
            var tr = document.createElement('tr');

            for (var j = 0; j < tHead.length; j++) {
                var td = document.createElement('td');
                td.innerText = tData[i][j];
                tr.appendChild(td);
            }
            tBodyCtl.appendChild(tr);
        }
        var totalCell = document.getElementById('total');
        totalCell.innerText = "总计：" + totalAmount.toFixed(2);
    }
</script>
